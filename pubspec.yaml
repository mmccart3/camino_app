name: camino_app
description: Offline-first Camino MVP with a replaceable bundled SQLite dataset.
publish_to: none
version: 0.2.99+104
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_map_vector_tiles: ^2.9.0
  flutter_map_vector_tiles_mbtiles: 1.0.0
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^10.2.1
  pdf: ^3.13.1
  printing: ^5.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/fonts/LiberationSans-Regular.ttf
    - assets/fonts/LiberationSans-Bold.ttf
    - assets/fonts/LICENSE_LIBERATION
    - assets/database/camino.sqlite
    - assets/stage_maps/
    - assets/elevation_charts/
    - assets/stage_images.json
    - assets/offline_maps/stages1_22_complete.mbtiles
    - assets/offline_maps/style.json
    - assets/offline_maps/poi_icons.png
    - assets/offline_maps/poi_icons.json
    - assets/offline_maps/poi_icons@2x.png
    - assets/offline_maps/poi_icons@2x.json
    - assets/offline_maps/poi_icons_license.txt

  fonts:
    - family: Fiesta
      fonts:
        - asset: assets/fonts/Fiesta.ttf
